<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify Card Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:#111;color:#fff;font-family:'Inter',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 16px 60px}
  h1{font-size:1.3rem;font-weight:700;margin-bottom:4px}
  h1 span{color:#1DB954}
  .sub{color:#444;font-size:.8rem;margin-bottom:24px}
  .wrap{display:flex;gap:32px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
  .panel{background:#1a1a1a;border:1px solid #222;border-radius:14px;padding:20px;width:280px}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#444;margin-bottom:5px}
  .field input{width:100%;background:#222;border:1px solid #2a2a2a;border-radius:8px;color:#fff;font-size:.88rem;font-family:inherit;padding:9px 11px;outline:none;transition:border-color .2s}
  .field input:focus{border-color:#1DB954}
  .upload-box{border:2px dashed #252525;border-radius:10px;padding:18px 10px;text-align:center;cursor:pointer;position:relative;transition:border-color .2s;margin-bottom:13px}
  .upload-box:hover{border-color:#1DB954}
  .upload-box input{position:absolute;inset:0;opacity:0;cursor:pointer}
  .upload-box .ico{font-size:1.5rem;margin-bottom:3px}
  .upload-box p{color:#444;font-size:.75rem}
  .upload-box p b{color:#666}
  .thumb{width:100%;height:80px;object-fit:cover;border-radius:7px;display:none;margin-bottom:10px}
  .sgroup{margin-bottom:13px}
  .srow{display:flex;justify-content:space-between;margin-bottom:5px}
  .srow span{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#444}
  .srow em{font-style:normal;font-size:.68rem;color:#555}
  .strack{position:relative;height:4px;background:#252525;border-radius:4px}
  .sfill{position:absolute;height:100%;background:#1DB954;border-radius:4px;pointer-events:none}
  input[type=range]{-webkit-appearance:none;width:100%;height:4px;background:transparent;position:absolute;inset:0;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;margin-top:-4px}
  .btn{width:100%;border:none;border-radius:50px;padding:11px;font-weight:700;font-size:.88rem;cursor:pointer;font-family:inherit;margin-bottom:8px;transition:opacity .15s,transform .1s}
  .btn:hover{opacity:.88;transform:scale(1.01)}
  .btn-green{background:#1DB954;color:#000}
  .btn-outline{background:transparent;color:#1DB954;border:1.5px solid #1DB954}
  .preview{display:flex;flex-direction:column;align-items:center;gap:10px}
  #cv{border-radius:18px;box-shadow:0 12px 40px #00000088;display:block;width:280px;height:auto}
  .hint{color:#2a2a2a;font-size:.7rem}
</style>
</head>
<body>
<h1>Spotify <span>Card</span> Maker</h1>
<p class="sub">Upload foto cover, isi teks — download PNG</p>
<div class="wrap">
  <div class="panel">
    <div class="upload-box" id="upBox">
      <input type="file" id="coverFile" accept="image/*">
      <div class="ico" id="upIco">🖼️</div>
      <p><b>Upload foto cover</b><br>JPG / PNG</p>
    </div>
    <img class="thumb" id="thumb" alt="">
    <div class="field"><label>Judul Lagu</label><input id="song" value="About You"></div>
    <div class="field"><label>Nama Artis</label><input id="artist" value="The 1975"></div>
    <div class="field"><label>Device</label><input id="device" value="iPhone"></div>
    <div class="sgroup">
      <div class="srow"><span>Posisi Lagu</span><em id="sval">0:02 / 5:26</em></div>
      <div class="strack">
        <div class="sfill" id="sf" style="width:.6%"></div>
        <input type="range" id="prog" min="0" max="326" value="2">
      </div>
    </div>
    <button class="btn btn-green" onclick="render()">✨ Apply</button>
    <button class="btn btn-outline" onclick="download()">⬇ Download PNG</button>
  </div>
  <div class="preview">
    <canvas id="cv"></canvas>
    <p class="hint">Live preview</p>
  </div>
</div>

// Koordinat kotak foto (pixel dalam 1080x1350):
// x: 177-902, y: 63-788
const F = {x:177, y:63, w:725, h:725};
const TW = 1080, TH = 1350;

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
cv.width = TW; cv.height = TH;
cv.style.width = '280px';
cv.style.height = Math.round(280*TH/TW)+'px';

let TMPL = null, COVER = null;

// Load template otomatis
const tmplImg = new Image();
tmplImg.onload = () => { TMPL = tmplImg; render(); };
tmplImg.src = TMPL_B64;

// Upload cover
document.getElementById('coverFile').addEventListener('change', async e => {
  const file = e.target.files[0]; if(!file) return;
  await loadCover(file);
});

const upBox = document.getElementById('upBox');
upBox.addEventListener('dragover', e => { e.preventDefault(); upBox.style.borderColor='#1DB954'; });
upBox.addEventListener('dragleave', () => upBox.style.borderColor='');
upBox.addEventListener('drop', async e => {
  e.preventDefault(); upBox.style.borderColor='';
  const file = e.dataTransfer.files[0];
  if(file?.type.startsWith('image/')) await loadCover(file);
});

async function loadCover(file) {
  COVER = await createImageBitmap(file);
  const t = document.getElementById('thumb');
  t.src = URL.createObjectURL(file); t.style.display='block';
  document.getElementById('upIco').textContent='✅';
  render();
}

// Slider
const prog = document.getElementById('prog');
const sf = document.getElementById('sf');
const sval = document.getElementById('sval');
prog.addEventListener('input', () => {
  const pct = prog.value/prog.max*100;
  sf.style.width = pct+'%';
  sval.textContent = fmt(+prog.value)+' / '+fmt(+prog.max);
  render();
});
function fmt(s){ return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }

// Live update teks
['song','artist','device'].forEach(id => document.getElementById(id).addEventListener('input', render));

function roundRect(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y); c.lineTo(x+w-r,y);
  c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r);
  c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h);
  c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r);
  c.quadraticCurveTo(x,y,x+r,y);
  c.closePath();
}

function render() {
  ctx.clearRect(0,0,TW,TH);
  if(!TMPL) return;

  // Buat offscreen canvas untuk template dengan lubang di area foto
  const off = document.createElement('canvas');
  off.width = TW; off.height = TH;
  const octx = off.getContext('2d');
  octx.drawImage(TMPL, 0, 0, TW, TH);
  // Punch hole = hapus area putih di foto box
  octx.globalCompositeOperation = 'destination-out';
  roundRect(octx, F.x, F.y, F.w, F.h, 50);
  octx.fill();

  // 1. Gambar cover dulu
  if(COVER) {
    ctx.save();
    roundRect(ctx, F.x, F.y, F.w, F.h, 50);
    ctx.clip();
    const sc = Math.max(F.w/COVER.width, F.h/COVER.height);
    const sw = COVER.width*sc, sh = COVER.height*sc;
    ctx.drawImage(COVER, F.x+(F.w-sw)/2, F.y+(F.h-sh)/2, sw, sh);
    ctx.restore();
  } else {
    ctx.fillStyle = '#2a2a2a';
    roundRect(ctx, F.x, F.y, F.w, F.h, 50);
    ctx.fill();
    ctx.fillStyle='#444'; ctx.font='bold 80px sans-serif';
    ctx.textAlign='center';
    ctx.fillText('🎵', F.x+F.w/2, F.y+F.h/2+28);
    ctx.textAlign='left';
  }

  // 2. Template (dengan lubang di foto box) di atas
  ctx.drawImage(off, 0, 0);

  // 3. Teks di area gelap bawah
  const song   = document.getElementById('song').value || 'Unknown';
  const artist = document.getElementById('artist').value || 'Unknown';
  const device = document.getElementById('device').value || 'iPhone';

  const TX = 185;
  // Device
  ctx.font = '30px Inter,sans-serif';
  ctx.fillStyle = 'rgba(200,200,200,1)';
  ctx.fillText(device, TX, 829);
  // Judul
  ctx.font = 'bold 50px Inter,sans-serif';
  ctx.fillStyle = '#fff';
  let s = song;
  while(ctx.measureText(s).width > F.w-20 && s.length>1) s=s.slice(0,-1);
  if(s!==song) s+='…';
  ctx.fillText(s, TX, 885);
  // Artis
  ctx.font = '36px Inter,sans-serif';
  ctx.fillStyle = 'rgba(185,185,185,1)';
  ctx.fillText(artist, TX, 938);

  // Waktu
  const cur = +prog.value, tot = +prog.max;
  const remain = tot - cur;
  ctx.font = '28px Inter,sans-serif';
  ctx.fillStyle = 'rgba(185,185,185,1)';
  ctx.fillText(fmt(cur), TX, 995);
  ctx.textAlign = 'right';
  ctx.fillText('-'+fmt(remain), F.x+F.w, 995);
  ctx.textAlign = 'left';
}

function download() {
  render();
  const a = document.createElement('a');
  a.download = 'spotify-card.png';
  a.href = cv.toDataURL('image/png');
  a.click();
}
</script>
